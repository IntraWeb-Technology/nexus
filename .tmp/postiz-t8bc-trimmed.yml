services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: unless-stopped
    environment:
      MAIN_URL: 'https://postiz.intrawebtech.com'
      FRONTEND_URL: 'https://postiz.intrawebtech.com'
      NEXT_PUBLIC_BACKEND_URL: 'https://postiz.intrawebtech.com/api'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      JWT_SECRET: '${JWT_SECRET}'
      DATABASE_URL: 'postgresql://postiz:${DB_PASSWORD}@postiz-postgres:5432/postiz_db'
      REDIS_URL: 'redis://postiz-redis:6379'
      TEMPORAL_ADDRESS: 'temporal:7233'
      RUN_CRON: 'true'
      X_URL: ''
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: '${DISABLE_REGISTRATION}'
      STORAGE_PROVIDER: 'local'
      UPLOAD_DIRECTORY: '/uploads'
      NEXT_PUBLIC_UPLOAD_DIRECTORY: '/uploads'
      EMAIL_FROM_ADDRESS: '${EMAIL_FROM_ADDRESS}'
      EMAIL_FROM_NAME: 'Postiz'
      OPENAI_API_KEY: '${OPENAI_API_KEY}'
      LINKEDIN_CLIENT_ID: '${LINKEDIN_CLIENT_ID}'
      LINKEDIN_CLIENT_SECRET: '${LINKEDIN_CLIENT_SECRET}'
      FACEBOOK_APP_ID: '${FACEBOOK_APP_ID}'
      FACEBOOK_APP_SECRET: '${FACEBOOK_APP_SECRET}'
      THREADS_APP_ID: '${THREADS_APP_ID}'
      THREADS_APP_SECRET: '${THREADS_APP_SECRET}'
      INSTAGRAM_APP_ID: '${INSTAGRAM_APP_ID}'
      INSTAGRAM_APP_SECRET: '${INSTAGRAM_APP_SECRET}'
    volumes:
      - postiz-config:/config
      - postiz-uploads:/uploads
    networks:
      - postiz-network
      - temporal-network
      - edge
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started

  postiz-provider-patcher:
    image: docker:27-cli
    restart: unless-stopped
    depends_on:
      postiz:
        condition: service_started
      temporal:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - /bin/sh
      - -ec
      - |
        CONTAINER=postiz-t8bc-postiz-1
        for i in $$(seq 1 90); do
          docker inspect $$CONTAINER >/dev/null 2>&1 && docker inspect -f '{{.State.Running}}' $$CONTAINER 2>/dev/null | grep -q true && break
          sleep 2
        done
        docker inspect -f '{{.State.Running}}' $$CONTAINER 2>/dev/null | grep -q true || { echo container not running; exit 1; }
        for i in $$(seq 1 90); do
          docker exec $$CONTAINER sh -c 'cat < /dev/null > /dev/tcp/temporal/7233' 2>/dev/null && break
          sleep 2
        done
        for BASE in /app/apps/backend/dist/libraries/nestjs-libraries/src/integrations/social /app/apps/orchestrator/dist/libraries/nestjs-libraries/src/integrations/social; do
          for FILE in linkedin.provider.js facebook.provider.js instagram.provider.js; do
            F="$$BASE/$$FILE"
            docker exec $$CONTAINER test -f "$$F" || continue
            docker exec $$CONTAINER sh -c "[ -f '$$F.bak-patches' ] || cp '$$F' '$$F.bak-patches'"
            docker exec $$CONTAINER sh -c "cp '$$F.bak-patches' '$$F'"
          done
          docker exec $$CONTAINER sh -c "sed -i \"/'r_basicprofile'/d; /'rw_organization_admin'/d; /'w_organization_social'/d; /'r_organization_social'/d\" '$$BASE/linkedin.provider.js'" 2>/dev/null || true
          docker exec $$CONTAINER sh -c "sed -i 's|prompt=none|prompt=consent|g' '$$BASE/linkedin.provider.js'" 2>/dev/null || true
          docker exec $$CONTAINER sh -c "sed -i \"/'pages_manage_engagement'/d; /'read_insights'/d\" '$$BASE/facebook.provider.js'" 2>/dev/null || true
          docker exec $$CONTAINER sh -c "sed -i \"s/'instagram_business_basic'/'instagram_basic'/g\" '$$BASE/instagram.provider.js'" 2>/dev/null || true
        done
        docker restart $$CONTAINER
        echo postiz restarted after temporal ready
        sleep infinity

  postiz-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: 'postiz'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: 'postiz_db'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postiz-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    environment:
      DB: 'postgres12'
      DB_PORT: '5432'
      POSTGRES_USER: 'temporal'
      POSTGRES_PWD: 'temporal'
      POSTGRES_SEEDS: 'temporal-postgresql'
      DYNAMIC_CONFIG_FILE_PATH: '/etc/temporal/config/dynamicconfig/development-sql.yaml'
      ENABLE_ES: 'true'
      ES_SEEDS: 'temporal-elasticsearch'
      ES_VERSION: 'v7'
    configs:
      - source: temporal-dynamic-config
        target: /etc/temporal/config/dynamicconfig/development-sql.yaml
    networks:
      - temporal-network
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy

  temporal-postgresql:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: 'temporal'
      POSTGRES_PASSWORD: 'temporal'
      POSTGRES_DB: 'temporal'
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      discovery.type: 'single-node'
      ES_JAVA_OPTS: '-Xms128m -Xmx128m'
      xpack.security.enabled: 'false'
    volumes:
      - temporal-es-data:/usr/share/elasticsearch/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postiz-config:
  postiz-uploads:
  postgres-data:
  redis-data:
  temporal-postgres-data:
  temporal-es-data:

networks:
  postiz-network:
  temporal-network:
  edge:
    external: true
    name: edge

configs:
  temporal-dynamic-config:
    content: |
      limit.maxIDLength:
        - value: 255
          constraints: {}
      system.forceSearchAttributesCacheRefreshOnRead:
        - value: true
          constraints: {}
