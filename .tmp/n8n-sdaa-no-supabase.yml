services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      - N8N_HOST=n8n.intrawebtech.com
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.intrawebtech.com/
      - N8N_EDITOR_BASE_URL=https://n8n.intrawebtech.com/
      - N8N_SECURE_COOKIE=true
      - NODE_OPTIONS=--dns-result-order=ipv4first --max-old-space-size=4096
    restart: unless-stopped
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - web

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "187.77.0.115:80:80"
      - "187.77.0.115:443:443"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /etc/caddy/Caddyfile << 'CADDYEOF'
        {
          email john.schibelli@intrawebtech.com
        }

        n8n.intrawebtech.com {
          reverse_proxy n8n:5678
        }

        postiz.intrawebtech.com {
          reverse_proxy postiz-t8bc-postiz-1:5000
        }

        postiz-t8bc.srv1343086.hstgr.cloud {
          reverse_proxy postiz-t8bc-postiz-1:5000
        }
        CADDYEOF
        exec caddy run --config /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
      - proxy
    depends_on:
      - n8n

networks:
  web:
  proxy:
    external: true
    name: edge

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
