name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      force_all:
        description: Rebuild and validate all workspace packages
        type: boolean
        default: false
      skip_turbo_cache:
        description: Force Turbo to ignore cache
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect affected
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.affected.outputs.base_sha }}
      head_sha: ${{ steps.affected.outputs.head_sha }}
      has_work: ${{ steps.affected.outputs.has_work }}
      validate_filter: ${{ steps.affected.outputs.validate_filter }}
      detection_failed: ${{ steps.affected.outputs.detection_failed }}
      force_all: ${{ steps.affected.outputs.force_all }}
      selected_apps_json: ${{ steps.affected.outputs.selected_apps_json }}
      skipped_apps_json: ${{ steps.affected.outputs.skipped_apps_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Fetch base refs
        run: |
          git fetch origin main development --prune || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        name: Restore pnpm store
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect affected packages
        id: affected
        env:
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all || 'false' }}
        run: node .github/scripts/affected.mjs

  validate:
    name: Validate
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        name: Restore pnpm store
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - uses: actions/cache@v4
        name: Restore Turbo cache
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Skip note
        if: needs.detect.outputs.has_work != 'true'
        run: |
          echo "No affected packages; skipping lint/typecheck/test/build." >> "$GITHUB_STEP_SUMMARY"

      - name: Run affected tasks
        if: needs.detect.outputs.has_work == 'true'
        env:
          TURBO_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_turbo_cache && 'true' || '' }}
        run: |
          set -euo pipefail
          FILTER="${{ needs.detect.outputs.validate_filter }}"
          BASE="${{ needs.detect.outputs.base_sha }}"
          EXTRA=()
          if [ "${TURBO_FORCE}" = "true" ]; then
            EXTRA+=(--force)
          fi

          if [ "$FILTER" = "__ALL__" ]; then
            echo "Validating entire workspace (force_all or fail-closed detection)."
            pnpm exec turbo run lint check-types test build "${EXTRA[@]}"
          elif [ "$FILTER" = "__NONE__" ]; then
            echo "Nothing to validate."
          else
            echo "Validating packages affected since ${BASE}"
            pnpm exec turbo run lint check-types test build --filter="...[${BASE}]" "${EXTRA[@]}"
          fi

      - name: Validation summary
        if: always()
        run: |
          {
            echo "## Validation"
            echo ""
            echo "- Base: \`${{ needs.detect.outputs.base_sha }}\`"
            echo "- Head: \`${{ needs.detect.outputs.head_sha }}\`"
            echo "- Force all: \`${{ needs.detect.outputs.force_all }}\`"
            echo "- Detection failed: \`${{ needs.detect.outputs.detection_failed }}\`"
            echo "- Selected apps: \`${{ needs.detect.outputs.selected_apps_json }}\`"
            echo "- Skipped apps: \`${{ needs.detect.outputs.skipped_apps_json }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  ci-gate:
    name: CI Gate
    needs: [detect, validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require detect + validate success
        run: |
          echo "detect=${{ needs.detect.result }}"
          echo "validate=${{ needs.validate.result }}"
          if [ "${{ needs.detect.result }}" != "success" ]; then
            echo "Detect job failed"
            exit 1
          fi
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "Validate job failed"
            exit 1
          fi
          echo "CI Gate passed"
