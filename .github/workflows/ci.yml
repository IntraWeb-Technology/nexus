name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Only build production apps (iw-portal + iw-site-q2) when those apps (or their deps) changed
      # vs the PR base (pull_request) or the previous commit on the branch (push).
      - name: Build production apps (affected only)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi
          if [ -z "$BASE" ]; then
            pnpm exec turbo run build --filter=@repo/iw-portal --filter=@repo/iw-site-q2
          else
            pnpm exec turbo run build \
              --filter="@repo/iw-portal...$BASE" \
              --filter="@repo/iw-site-q2...$BASE"
          fi
